name: iOS app

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version

      - name: Engine tests
        run: |
          swiftc ios/PhysioHunch/Engine/*.swift ios/EngineTests/main.swift -o engine-tests
          ./engine-tests ios/PhysioHunch/Resources/Data

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/PhysioHunch.xcodeproj -target PhysioHunch \
            -sdk iphonesimulator -configuration Debug \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build | tail -80

      - name: Play a demo on an iPhone 15 simulator
        run: |
          set -x
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          UDID=$(xcrun simctl create "iPhone 15 Demo" com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/PhysioHunch.app
          mkdir -p demo
          xcrun simctl io "$UDID" recordVideo --codec h264 --force demo/iphone15-mia.mp4 &
          REC=$!
          sleep 2
          xcrun simctl launch "$UDID" com.physiohunch.app -caseIndex 0 \
            -demoMoves "what happened|ottawa|anterior drawer|lachman|single leg balance|lateral ankle sprain"
          for i in 01 02 03 04 05 06 07 08 09 10 11; do sleep 2.5; xcrun simctl io "$UDID" screenshot "demo/shot-$i.png"; done
          sleep 3
          xcrun simctl io "$UDID" screenshot demo/shot-12-debrief.png
          kill -INT $REC; wait $REC || true
          ls -la demo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone15-demo
          path: demo/
          if-no-files-found: warn
