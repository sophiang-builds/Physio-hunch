<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physio Hunch · Case expansion</title>
  <link rel="icon" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../assets/brand.css">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--ph-room); color: var(--ph-ink); font: 1rem/1.5 var(--ph-font-body); }
    main { max-width: 1120px; padding: clamp(1rem, 4vw, 3rem); margin: auto; }
    .logo { display: block; width: min(185px, 100%); margin-bottom: 1.5rem; }
    h1, h2, h3 { font-family: var(--ph-font-display); line-height: 1.14; font-weight: 650; margin: 0; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); }
    h2 { font-size: 1.5rem; }
    h3 { font-size: 1.1rem; }
    label { display: grid; gap: .25rem; font-weight: 700; }
    input, select, button { font: inherit; color: inherit; }
    input, select { width: 100%; border: 1px solid #857694; padding: .55rem; background: #fffaf0; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--ph-violet); outline-offset: 2px; }
    .filter { display: grid; grid-template-columns: 1fr minmax(260px, .65fr); gap: .8rem; margin-block: 1.25rem; }
    .viewer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 1.25rem; align-items: start; }
    .portrait-column { display: grid; justify-items: center; gap: .65rem; }
    .pose {
      width: min(100%, 18rem);
      aspect-ratio: 1;
      image-rendering: pixelated;
      border: 2px solid #aaa0b0;
      background-color: var(--ph-lilac);
      background-size: 400% 400%;
      background-repeat: no-repeat;
    }
    .turns { display: flex; align-items: center; gap: .6rem; }
    .turns button { border: 1px solid var(--ph-violet); background: #fffaf0; min-width: 44px; min-height: 44px; }
    .atlas-link, a { color: var(--ph-violet); }
    .case { background: #fffaf0; border: 1px solid #c9b48e; border-bottom: 5px solid #dbc79d; padding: clamp(1rem, 4vw, 1.5rem); }
    .case p { margin: .25rem 0 .95rem; }
    #patient-meta { color: var(--ph-muted); }
    details { margin-block-start: .75rem; }
    summary { cursor: pointer; color: var(--ph-violet); font-weight: 700; }
    .roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 195px),1fr)); gap: .55rem; }
    .roster button { display: flex; text-align: left; align-items: center; gap: .6rem; background: #fffaf0; border: 1px solid #c7b8c9; min-height: 60px; }
    .roster button[aria-pressed="true"] { border-color: var(--ph-violet); background: #eae0fa; }
    .roster img { width: 46px; image-rendering: pixelated; background: #eee1fc; flex-shrink: 0; }
    .roster small { display: block; color: var(--ph-muted); }
    @media (max-width: 590px) { .filter, .viewer { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <img class="logo" src="../assets/logo.svg" alt="Physio Hunch">
  <h1>Case expansion</h1>
  <p>Browse 100 fictional patients across ten areas of physiotherapy.</p>
  <div class="filter">
    <label>Find a patient or presenting complaint<input id="search" type="search"></label>
    <label>Practice area<select id="area"><option value="">All areas</option></select></label>
  </div>
  <section id="viewer" class="viewer" aria-label="Selected patient" hidden>
    <div class="portrait-column">
      <div id="pose" class="pose" role="img"></div>
      <div class="turns">
        <button id="previous" type="button" aria-label="Previous angle">←</button>
        <output id="angle" aria-live="polite">0°</output>
        <button id="next" type="button" aria-label="Next angle">→</button>
      </div>
      <a id="atlas" class="atlas-link">Open all 16 views</a>
    </div>
    <article class="case">
      <h2 id="patient-name" tabindex="-1"></h2>
      <p id="patient-meta"></p>
      <p id="art-status"></p>
      <h3>Case background</h3><p id="setting"></p>
      <h3>History of presenting complaint</h3><p id="subjective"></p>
      <details id="debrief">
        <summary>Show author notes</summary>
        <h3>Suggested assessment or next action</h3><p id="assessment"></p>
        <h3>Expected finding</h3><p id="finding"></p>
        <h3>Reasoning target</h3><p id="answer"></p>
      </details>
    </article>
  </section>
  <p id="status" role="status">Loading the case roster…</p>
  <div class="roster" id="roster" aria-label="Patients"></div>
</main>
<script type="module" src="./expansion-roster.js"></script>
</body>
</html>
