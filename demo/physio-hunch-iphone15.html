:root{color-scheme:light dark;--page:light-dark(#ece7dc,#121117);--pink:light-dark(#5d586c,#b9b3c6);
 --room:#F7F3EA;--ink:#24203C;--muted:#5D586C;--violet:#543C86;--lilac:#D7C8F1;--safety:#9A3D38}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);font:16px/1.45 "PH Text",-apple-system,system-ui,sans-serif;overflow-x:clip;display:flex;align-items:center;justify-content:center;gap:48px;padding:24px max(5vw,16px,env(safe-area-inset-left,0px))}
.side{max-width:300px;color:var(--pink);font-size:15px}
.side h1{font:650 34px/1.05 "PH Display",sans-serif;letter-spacing:-.02em;color:light-dark(#24203C,#f1eef7);margin:0 0 10px}
.side p{margin:0 0 10px}
.side button{font:700 15px "PH Text",sans-serif;border:1px solid light-dark(#cfc8d9,#3a3546);background:light-dark(#fff,#1d1b24);color:light-dark(#24203C,#eee);border-radius:999px;padding:10px 16px;margin:4px 6px 0 0;cursor:pointer}
.side button[aria-pressed=true]{background:#543C86;color:#fff;border-color:#543C86}
.wrap{--s:1;width:calc(433px*var(--s));height:calc(892px*var(--s));flex:none}
.phone{width:433px;height:892px;transform:scale(var(--s));transform-origin:0 0;border-radius:72px;padding:20px;position:relative;
 background:linear-gradient(145deg,#4a4e57,#1d1f24 40%,#3b3f47 70%,#16171b);box-shadow:inset 0 0 0 2px #6b707a,inset 0 0 0 7px #0b0b0d,0 30px 70px rgba(20,18,30,.35)}
.btn{position:absolute;background:#2a2d33;border-radius:2px}
.screen{width:393px;height:852px;border-radius:55px;overflow:hidden;position:relative;background:var(--room);color:var(--ink);isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;border-radius:20px;background:#000;z-index:30}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:4px 34px 0 44px;font:600 17px -apple-system,system-ui,sans-serif;z-index:25;color:#000}
.status svg{display:block}
.wash{position:absolute;inset:0;z-index:-1;transition:opacity 1.2s}
/* Liquid Glass */
.glass{background:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(14px) saturate(1.9);backdrop-filter:blur(14px) saturate(1.9);
 box-shadow:inset 0 0 0 .7px rgba(255,255,255,.75),inset 0 1.2px 0 rgba(255,255,255,.9),inset 0 -1px 1px rgba(255,255,255,.25),0 6px 18px -6px rgba(36,32,60,.25);position:relative}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 20% 0%,rgba(255,255,255,.55),transparent 55%);mix-blend-mode:soft-light}
.nav{position:absolute;top:54px;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}
.nav .mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.nav .title{font:700 16px "PH Text";transition:opacity .2s}
.nav .call{height:44px;border-radius:22px;padding:0 16px;border:0;font:700 15px "PH Text";color:var(--violet);cursor:pointer}
.nav .call:disabled{color:rgba(36,32,60,.35)}
.top{position:absolute;top:106px;left:20px;right:20px}
.scroll{position:absolute;top:522px;left:0;right:0;bottom:150px;overflow-y:auto;overflow-x:hidden;padding:4px 20px 30px;scrollbar-width:none;-webkit-mask:linear-gradient(transparent,#000 14px,#000 calc(100% - 26px),transparent);mask:linear-gradient(transparent,#000 14px,#000 calc(100% - 26px),transparent)}
.scroll::-webkit-scrollbar{display:none}
.stage{height:300px;border-radius:28px;position:relative;overflow:hidden;display:grid;place-items:center}
.disc{position:absolute;width:230px;height:230px;border-radius:50%;background:var(--lilac);overflow:hidden}
.disc i{position:absolute;inset:0;opacity:0;transition:opacity 1.2s}
.pt{position:absolute;inset:0;display:flex;justify-content:center;transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.spin{height:300px;width:150px;perspective:600px}
.spin>div{height:100%;transform-origin:50% 50%}
.spin svg{width:150px;height:300px;display:block}
.sit{font:700 17px/1.35 "PH Text";text-align:center;margin:10px 0 12px}
.slots{display:flex;gap:10px;justify-content:center}
.slot{width:44px;height:44px;border-radius:50%;border:1.5px dashed rgba(36,32,60,.35);display:grid;place-items:center;font:700 16px "PH Text";color:var(--muted);background:none;padding:0;position:relative}
.slot.used{border:0;cursor:pointer}
.slot.hit{background:color-mix(in srgb,var(--violet) 78%,rgba(255,255,255,.2));color:#fff}
.slot b{position:absolute;top:-3px;right:-3px;width:15px;height:15px;border-radius:50%;background:var(--safety);color:#fff;font-size:10px;line-height:15px}
.card{background:#fff;border-radius:22px;padding:14px 16px;margin-bottom:10px;box-shadow:inset 0 0 0 1.5px rgba(36,32,60,.08);animation:rise .45s cubic-bezier(.2,.9,.3,1.15)}
.card.hit{box-shadow:inset 0 0 0 1.5px rgba(84,60,134,.5)}
.card h4{margin:0 0 4px;font:700 14px "PH Text";color:var(--muted)}
.card p{margin:0}
.card.miss p{color:var(--muted);font-style:italic}
.card .flag{color:var(--safety);font:700 14px "PH Text";margin-top:6px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.97)}}
.dock{position:absolute;left:12px;right:12px;bottom:30px;z-index:20;display:flex;flex-direction:column;gap:10px}
.toast{align-self:center;border-radius:999px;padding:9px 16px;font-size:15px;animation:rise .3s}
.field{border-radius:24px;padding:0 18px;height:52px;display:flex;align-items:center}
.field input{border:0;outline:0;background:none;font:17px "PH Text";color:var(--ink);width:100%}
.field input::placeholder{color:rgba(36,32,60,.5)}
.go{height:52px;border-radius:26px;border:0;font:700 17px "PH Text";color:#fff;cursor:pointer;
 background:linear-gradient(180deg,#6b54a0,#543C86);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.15),0 8px 20px -8px rgba(84,60,134,.7)}
.go:active{transform:scale(.97)}.go:disabled{opacity:.45}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#000;z-index:40}
.sheet{position:absolute;inset:0;z-index:35;background:rgba(36,32,60,.2);display:flex;align-items:flex-end}
.sheet>div{width:100%;max-height:92%;overflow:auto;background:rgba(247,243,234,.86);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border-radius:38px 38px 0 0;padding:14px 24px 40px;box-shadow:inset 0 1px 0 #fff;animation:up .45s cubic-bezier(.2,.9,.3,1.05)}
@keyframes up{from{transform:translateY(60%)}}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(36,32,60,.25);margin:0 auto 16px}
.verdict{font:650 34px/1.05 "PH Display";letter-spacing:-.02em;margin:0 0 6px}
.sheet h5{font:700 14px "PH Text";color:var(--muted);margin:16px 0 6px}
.sheet p{margin:0}
.sheet ul{list-style:none;padding:0;margin:0}.sheet li{padding:6px 0;border-top:1px solid rgba(36,32,60,.08)}
.sheet .go{width:100%;margin-top:20px}
@media(prefers-reduced-motion:reduce){.pt,.wash,.disc i{transition:none}.card,.toast,.sheet>div{animation:none}}
@media(max-width:820px){.side{display:none}body{padding:12px}}

const $=s=>document.getElementById(s), VIEWS=["front","right","back","left"];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// ---- engine: same rules as ios/PhysioHunch/Engine ----
const norm=s=>{let o="";for(const ch of s.toLowerCase()){if(ch==="’"||ch==="'")o+="'";else if(/[\p{L}\p{N}]/u.test(ch))o+=ch;else o+=" ";}return o.split(" ").filter(Boolean).join(" ");};
const contains=(a,t)=>(" "+t+" ").includes(a.length<=3?` ${a} `:` ${a}`);
const dist=(a,b)=>{a=[...a];b=[...b];if(!a.length)return b.length;if(!b.length)return a.length;let p=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[b.length];};
const fuzzy=(a,t)=>{const aw=a.split(" "),w=t.split(" ");if(!aw.every(x=>x.length>=5))return false;return aw.every(x=>{const tol=x.length>=8?2:1;return w.some(y=>{if(y.length<x.length-tol)return false;const L=[...new Set([x.length-1,x.length,x.length+1].filter(n=>n>0&&n<=y.length))];if(!L.length)return dist(x,y)<=tol;return L.some(n=>dist(x,y.slice(0,n))<=tol);});});};
const score=(al,t)=>{const a=norm(al);if(!a)return 0;if(a===t)return 3000+a.length;if(contains(a,t))return 2000+a.length;if(fuzzy(a,t))return 1000+a.length;return 0;};
const resolve=(inp,p)=>{const t=norm(inp);if(!t)return null;let b={s:0,i:[]};for(const a of A){const s=Math.max(...a.aliases.map(x=>score(x,t)));if(s>b.s)b={s,i:[a]};else if(s===b.s&&s>0)b.i.push(a);}return b.s?(b.i.find(a=>p.findings[a.id]!=null)||b.i[0]):null;};
const any=(ps,inp)=>{const t=norm(inp);return ps.some(p=>contains(norm(p),t));};
let ci=0, st, shown=0;
const has=id=>st.turns.some(t=>t.a.id===id);
function load(i){ci=i;st={p:C[i],limit:5,turns:[],phase:"assessing",flags:[]};shown=0;$("ask").value="";$("sheet").hidden=true;render(true);}
function submit(raw){const text=raw.trim();if(!text||st.phase==="done")return;
  if(st.phase==="calling"||["i think","i reckon","my diagnosis","diagnosis","my call"].some(x=>norm(text).startsWith(x)))return call(text);
  const a=resolve(text,st.p);if(!a)return toast("Not an assessment I know. Try “straight leg raise”.");
  if(has(a.id))return toast("Already done. Tap slot to reread.");
  const t={n:st.turns.length+1,a,finding:st.p.findings[a.id]??null,flag:null};
  for(const r of st.p.safety)if(r.assessments.includes(a.id)&&!r.requires.every(has))t.flag=r.message;
  st.turns.push(t);if(t.flag&&!st.flags.includes(t.flag))st.flags.push(t.flag);
  if(st.turns.length>=st.limit)st.phase="calling";
  $("ask").value="";render();if(t.finding)turn();
  setTimeout(()=>{const s=$("scroll");s.scrollTo({top:s.scrollHeight,behavior:"smooth"});},60);
}
function call(text){st.call=text;st.verdict=any(st.p.answers,text)?"correct":any(st.p.close,text)?"close":"wrong";st.phase="done";
  let pts={correct:60,close:30}[st.verdict]||0;pts+=8*st.p.key.filter(has).length;pts-=20*st.flags.length;st.score=Math.max(0,Math.min(100,pts));$("ask").value="";render();setTimeout(result,500);}
const hits=()=>st.turns.filter(t=>t.finding).length;
// ---- view ----
function spec(){return SPECS.find(s=>s.id===st.p.id);}
function draw(){$("spin").innerHTML=Turnaround.renderView(spec(),VIEWS[shown]).replace('width="240" height="480"','');}
function turn(){const target=hits()%4;if(target===shown)return;const el=$("spin");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){shown=target;draw();return;}
  el.animate([{transform:"rotateY(0)"},{transform:"rotateY(90deg)"}],{duration:220,easing:"ease-in",fill:"forwards"}).onfinish=()=>{shown=target;draw();el.animate([{transform:"rotateY(-90deg)"},{transform:"rotateY(0)"}],{duration:300,easing:"ease-out",fill:"forwards"});};}
function render(fresh){const p=st.p,h=hits(),reveal=st.phase==="done"?1:h/st.limit,zoom=1+.16*h,[fx,fy]=p.focus,drift=(.5-fy)*300*Math.min(1,(zoom-1)/.64);
  if(fresh)draw();
  $("bloom").style.background=`linear-gradient(135deg,${p.palette.join(",")})`;$("bloom").style.opacity=reveal;
  $("wash").style.background=`linear-gradient(180deg,${p.palette[0]}55,${p.palette[1]}33 45%,transparent 75%)`;$("wash").style.opacity=reveal;
  $("pt").style.transform=`translateY(${drift}px) scale(${zoom})`;$("pt").style.transformOrigin=`${fx*100}% ${fy*100}%`;
  $("sit").textContent=p.situation;
  $("title").textContent=st.phase==="assessing"?(st.limit-st.turns.length===1?"1 assessment left":`${st.limit-st.turns.length} assessments left`):st.phase==="calling"?"Make your call":"Debrief";
  $("call").disabled=st.phase!=="assessing";
  $("slots").innerHTML=Array.from({length:st.limit},(_,i)=>{const t=st.turns[i];return t?`<button class="slot used glass ${t.finding?"hit":""}" data-i="${i}" aria-label="Assessment ${t.n}, ${esc(t.a.name)}">${t.n}${t.flag?"<b>!</b>":""}</button>`:`<span class="slot" aria-label="Empty slot"></span>`;}).join("");
  $("cards").innerHTML=st.turns.map(t=>`<div class="card ${t.finding?"hit":"miss"}" id="c${t.n}"><h4>${t.n}. ${esc(t.a.name)}</h4><p>${esc(t.finding||"No response.")}</p>${t.flag?`<div class="flag">⚠ ${esc(t.flag)}</div>`:""}</div>`).join("");
  $("ask").placeholder=st.phase==="assessing"?`Assessment ${st.turns.length+1} of ${st.limit}, e.g. slump test`:`What's wrong with ${p.name}?`;
  $("go").textContent=st.phase==="assessing"?"Assess":"Make your call";
  if(st.phase==="calling")$("ask").focus({preventScroll:true});
  document.querySelectorAll("#pick button").forEach((b,i)=>b.setAttribute("aria-pressed",i===ci));
}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600);}
function result(){const p=st.p,v={correct:["Spot on","#543C86"],close:["Close","#24203C"],wrong:["Not quite","#9A3D38"]}[st.verdict];
  $("sheetBody").innerHTML=`<div class="grab"></div><h2 class="verdict" style="color:${v[1]}">${v[0]}</h2>
  <p style="color:var(--muted)">Your call: “${esc(st.call)}” · <b style="color:var(--ink)">${st.score} pts</b></p>
  <h5>It was</h5><p style="font-weight:700;font-size:19px">${esc(p.diagnosis)}</p>
  ${st.flags.length?`<h5>Safety</h5>${st.flags.map(f=>`<p style="color:var(--safety)">⚠ ${esc(f)}</p>`).join("")}`:""}
  <h5>What was going on</h5><p>${esc(p.story)}</p>
  <h5>Most telling assessments</h5><ul>${p.key.map(id=>`<li style="color:${has(id)?"#543C86":"#5D586C"}">${has(id)?"✓":"○"} ${esc(A.find(a=>a.id===id).name)}</li>`).join("")}</ul>
  <button class="go" id="next">Next patient</button>`;$("sheet").hidden=false;$("next").onclick=()=>load((ci+1)%C.length);}
$("slots").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;const c=$("c"+(+b.dataset.i+1));c&&c.scrollIntoView({behavior:"smooth",block:"center"});c&&c.animate([{transform:"scale(1.03)"},{transform:"none"}],{duration:400});});
$("dock").addEventListener("submit",e=>{e.preventDefault();submit($("ask").value);});
$("call").onclick=()=>{if(st.phase==="assessing"){st.phase="calling";render();}};
$("pick").innerHTML=C.map((c,i)=>`<button data-c="${i}">${esc(c.name)}, ${c.age}</button>`).join("");
$("pick").addEventListener("click",e=>{const b=e.target.closest("[data-c]");b&&load(+b.dataset.c);});
const fit=()=>{const s=Math.min(1,(innerHeight-24)/892,(innerWidth-24)/433);$("wrap").style.setProperty("--s",s);};
addEventListener("resize",fit);fit();
load(0);
// opening state: a game in progress
["what happened","ottawa"].forEach(m=>submit(m));
}
